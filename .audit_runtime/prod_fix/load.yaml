server:
  host: "127.0.0.1"
  port: 18320
  threads: 8
  log_level: "info"
database:
  driver: "sqlite"
  path: "load.db"
  sqlite:
    path: "load.db"
    busy_timeout_ms: 1000
auth:
  enabled: false
  secret_key: "vms-ai-secret-key-change-me-in-production"
  algorithm: "HS256"
  token_expire_minutes: 10080
  ldap:
    enabled: false
cors:
  enabled: true
  origins: ["*"]
  methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
  headers: ["*"]
  credentials: true
websocket:
  port: 0
  heartbeat_interval_sec: 30
  ping_interval_sec: 20
  ping_timeout_sec: 10
  max_message_size_mb: 10
  update_interval_ms: 100
ai_server:
  enabled: false
storage:
  driver: "local"
  minio:
    endpoint: "http://127.0.0.1:65530"
    access_key: "minioadmin"
    secret_key: "minioadmin"
    bucket_recordings: "vms-recordings"
    bucket_snapshots: "vms-snapshots"
logging:
  level: "info"
  file_path: "logs/load.log"
  console_output: true
  file_output: true
  max_file_size_mb: 100
  max_files: 5
