# Windows-oriented nginx fallback for serving vms-frontend/dist separately.
# Preferred deployment is still the backend static route in cpp-backend/src/server/http_server.cpp.

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream backend_api {
        server 127.0.0.1:8000;
    }

    upstream backend_ws {
        server 127.0.0.1:8083;
    }

    server {
        listen 3000;
        server_name localhost;

        # Copy vms-frontend/dist into nginx/html or update this path explicitly.
        root html;
        index index.html;

        location /api/ {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /ws {
            proxy_pass http://backend_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 1h;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
