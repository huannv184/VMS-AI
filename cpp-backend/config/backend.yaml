# VMS Backend Configuration
# This file contains all configuration for the VMS AI Backend server

# ============================================================================
# SERVER CONFIGURATION
# ============================================================================
server:
  host: "0.0.0.0"
  port: 8000
  threads: 8
  log_level: "info"  # debug, info, warning, error, critical

# ============================================================================
# DATABASE CONFIGURATION
# ============================================================================
database:
  path: "data/events.db"
  connection_pool_size: 10
  busy_timeout_ms: 5000

# ============================================================================
# AUTHENTICATION
# ============================================================================
auth:
  enabled: true
  # SEC-C1: Set VMS_JWT_SECRET env var (min 32 chars) before deploying.
  # This default value matches the sentinel in config.cpp::loadConfig (SEC-C1
  # guard). Backend WILL refuse to start unless one of:
  #   - VMS_JWT_SECRET=<32+ char random> is exported (production path), OR
  #   - VMS_ALLOW_DEFAULT_SECRET=1 is exported (dev escape hatch, logs CRITICAL).
  # Earlier this YAML drifted to "vms-ai-secret-key-for-local-development-..."
  # which silently bypassed the guard because the sentinel string didn't match.
  secret_key: "vms-ai-secret-key-change-me-in-production"
  algorithm: "HS256"
  token_expire_minutes: 480   # 8 hours — reduced from 7 days; revocation via token_version
  
  # LDAP Configuration (Optional)
  ldap:
    enabled: false
    host: "192.168.1.10"
    port: 389
    domain: "CORP"
  
# ============================================================================
# CORS CONFIGURATION
# ============================================================================
# SEC-CORS (2026-05-22): origins must be an explicit allowlist when
# credentials:true. Backend WILL refuse to start if origins contains "*"
# AND credentials:true (CSRF-vector combination forbidden by W3C). For
# local development against Vite (http://localhost:5173) the defaults
# below already work; for production replace with your real frontend
# domain(s). Env escape hatch for non-credentialed dev:
# VMS_ALLOW_WILDCARD_CORS=1 (logs CRITICAL on every start).
cors:
  enabled: true
  origins:
    - "http://localhost:3000"   # Vite dev server (vite.config.js strictPort)
    - "http://127.0.0.1:3000"
    - "http://localhost:5173"   # legacy Vite default port — kept for parity
    - "http://localhost:8000"   # same-host backend (serving built FE)
    - "http://127.0.0.1:5173"
    - "http://127.0.0.1:8000"
  methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
  headers: ["*"]
  credentials: true

# ============================================================================
# SECURITY CONFIGURATION
# ============================================================================
# trusted_proxies — list of IPs (one per reverse proxy in front of the backend)
#   whose X-Forwarded-For header is honoured for resolving client IP.
#   Used by:
#     - /api/login rate limiter (per-IP login throttle)
#     - /api/ws/ticket IP-binding claim
#   Empty list (default) = XFF always ignored, peer IP wins. This is the
#   safe default for deployments WITHOUT a reverse proxy. When you put
#   nginx / HAProxy / caddy / Cloudflare-Tunnel / IIS in front, list its
#   IPs here. "loopback" is a convenience alias = [127.0.0.1, ::1].
# CIDR not yet supported — list each proxy IP explicitly.
security:
  trusted_proxies: []
  # Example (sidecar reverse proxy on same host):
  # trusted_proxies:
  #   - "loopback"
  # Example (separate-host proxy):
  # trusted_proxies:
  #   - "10.0.0.5"
  #   - "10.0.0.6"

# ============================================================================
# WEBSOCKET CONFIGURATION
# ============================================================================
websocket:
  port: 8083
  heartbeat_interval_sec: 30
  ping_interval_sec: 20
  ping_timeout_sec: 10
  max_message_size_mb: 10            # applied to QWebSocket::setMaxAllowedIncomingMessageSize
  update_interval_ms: 100            # Metadata update interval

  # 2026-05-17 WS DoS hardening — both default 0 (= unlimited) so a binary
  # upgrade does not suddenly reject connections. Set non-zero per deployment:
  #   max_connections_global: 200    # cap total concurrent WS sockets
  #   max_connections_per_ip: 10     # cap concurrent sockets per source IP
  # When set, a connection over the cap is closed with CloseCodePolicyViolated
  # at accept-time and counted in /api/rules/stats websocket.conn_cap_rejected_total.
  # See ws_observability_2026_05_17 memo for sizing guidance.
  max_connections_global: 0
  max_connections_per_ip: 0

# ============================================================================
# AI SERVER INTEGRATION (C++ ai-server via ZMQ)
# ============================================================================
ai_server:
  enabled: true
  base_zmq_port: 5555  # Port = base_port + camera_id
  zmq_timeout_ms: 1000
  reconnect_interval_sec: 5

# ============================================================================
# AI DETECTION TUNING THRESHOLDS
# ============================================================================
# These knobs are read by the parent vms_backend at boot and exported into
# the process env BEFORE spawning ai_worker_v2 children. The child reads via
# std::getenv so the same values apply to every spawned camera worker.
#
# Override order: env var > yaml > hardcoded fallback. If you set the env
# var yourself (e.g. PowerShell `$env:VMS_MIN_PERSON_HEIGHT_PX = "30"`),
# this yaml value is ignored — that lets you A/B tune in a single session
# without editing yaml.
ai:
  # min_person_height_px: drop person-class (COCO class_id 0) detections
  # with bbox height smaller than this many pixels in the source frame.
  # Combats distant-noise false positives (vegetation, fence texture,
  # shadow). Trade-off:
  #   - Lower  → see people farther from camera; more false-positive risk
  #     on cluttered backgrounds.
  #   - Higher → cleaner alerts; miss legitimately distant subjects.
  # Default 20 is a permissive baseline that works for typical
  # human-scale-mounted cameras. The 2026-05-08 Fix-B operator
  # ("thùng rác cũng ra người, mặt đường lại ra khuôn mặt tôi") chose
  # 40 for their specific deployment with clutter-heavy backgrounds.
  # Maps to env var VMS_MIN_PERSON_HEIGHT_PX consumed by ai_worker_v2.
  min_person_height_px: 20

  # ---------------------------------------------------------------------
  # PPE (Personal Protective Equipment) class-label config.
  #
  # The PPE engine deployed under cpp-backend/.../models/PPE-YOLOv8m.engine
  # is detection-only — it emits helmet/vest/person/gloves/mask/boots
  # bounding boxes by class_id. Violation classes (NoHelmet/NoVest) are
  # DERIVED in ai_worker by checking whether each detected PERSON bbox
  # contains a HELMET and a VEST bbox (≥50% containment of the smaller
  # bbox area). Compliance rate is rolled up by `PpeComplianceAggregator`
  # (see /api/analytics/ppe_compliance).
  #
  # Edit this block when retraining the engine with a different class
  # order. Use `tools/test_ppe_engine.py` to discover the engine's actual
  # class names (model.names sidecar metadata) before editing.
  #
  # Defaults below match the engine shipped 2026-05-19. Leave the whole
  # `ppe:` block commented out (or remove it) to keep these defaults.
  # Maps to env var VMS_AI_PPE_CONFIG_JSON consumed by ai_worker_v2.
  #
  # ppe:
  #   # Human-readable label per class_id 0..N. Used for UI overlays
  #   # and ai_worker logs. Must match the engine's class count + order
  #   # (mismatch → wrong labels but no crash).
  #   labels:
  #     - Helmet
  #     - Vest
  #     - PPE_Person
  #     - Gloves
  #     - Mask
  #     - Boots
  #   # Which engine class_id is "person" for violation pairing (the
  #   # denominator). Set to -1 to disable the PPE feature entirely.
  #   person_class: 2
  #   # Which class_id is "helmet" for the NoHelmet compliance check.
  #   # Set to -1 if your deployment doesn't enforce hard hats — then
  #   # NoHelmet violations are not emitted and compliance ignores
  #   # helmet absence.
  #   helmet_class: 0
  #   # Same shape for "vest". Set to -1 to skip the NoVest check.
  #   vest_class: 1
  #   # 2026-05-21 expanded enforcement: gloves / mask / boots are now
  #   # paired against persons too and emit NoGloves / NoMask / NoBoots
  #   # violations (synthetic class_ids 408 / 409 / 410). Defaults match
  #   # the shipped 6-class engine. Set any one to -1 to skip that check
  #   # — e.g. an indoor office camera should likely disable gloves +
  #   # boots since employees walking through aren't required to wear
  #   # them.
  #   gloves_class: 3
  #   mask_class:   4
  #   boots_class:  5

# ============================================================================
# MEDIA SIGNING (presigned URLs for snapshots, recordings, etc.)
# ============================================================================
media_signing:
  strict_scope_required: true
  max_ttl_seconds: 900           # C6: 15-minute hard ceiling on presigned URL lifetime
  allow_legacy_unsigned: false   # M8: disable unscoped legacy presign format
  default_ttl_seconds: 120
  snapshot_ttl_seconds: 180
  event_video_ttl_seconds: 300
  recording_video_ttl_seconds: 300
  segment_video_ttl_seconds: 300
  camera_frame_ttl_seconds: 60
  storage_ttl_seconds: 180

# ============================================================================
# CAMERA CONFIGURATION
# ============================================================================
cameras:
  max_cameras: 10
  timeout_sec: 30
  auto_start_on_boot: false
  
# ============================================================================
# ROI CONFIGURATION
# ============================================================================
roi:
  enabled: true
  config_file: "data/config/roi_config.yml"
  auto_save: true
  
# ============================================================================
# EVENT SYSTEM
# ============================================================================
events:
  enabled: true
  retention_days: 30
  cleanup_interval_hours: 24
  max_events_per_query: 1000
  
  # Event detectors
  detectors:
    intrusion: true
    line_crossing: true
    loitering: true
    people_counting: true
    
  # Loitering settings
  loitering_threshold_sec: 30

# ============================================================================
# ALERT DELIVERY POOL SIZING (BUG-ALERT-CASCADE-POOL-01 phase 2)
# ============================================================================
# Per-channel pool sizing for vms::events::deliverAction. Each channel runs
# on its own BackgroundJobRunner so a stalled webhook does NOT queue SMS /
# Telegram / alarm-relay sends behind it. Leave keys out (or set 0) to use
# the defaults baked into alert_delivery.cpp — they match the operator-green-
# lit 2026-05-17 sizing.
#
# Sizing rationale (don't tune blindly):
#   webhook  4/256 : operator-supplied URL, unknown SLA, biggest stall risk.
#                    4 workers absorb parallel stalls; 256 queue absorbs
#                    ~100 evt/s × 2.5 s without drop.
#   sms      2/128 : hard ceiling is Twilio's ~1 msg/s per long-code number;
#                    more workers just queue more 429s.
#   telegram 2/128 : api.telegram.org ~30 msg/s per chat; 2 workers covers it.
#   alarm    1/64  : LAN endpoint, ms-latency; small queue intentional —
#                    a stale alarm is useless, drop is the right semantic.
#
# Sizes are captured at first delivery call and frozen for program lifetime;
# live reload not supported.
alert_delivery:
  webhook:
    workers: 4
    queue_size: 256
  sms:
    workers: 2
    queue_size: 128
  telegram:
    workers: 2
    queue_size: 128
  alarm:
    workers: 1
    queue_size: 64

# ============================================================================
# SNAPSHOT SYSTEM
# ============================================================================
snapshots:
  enabled: true
  storage_path: "data/snapshots"
  max_storage_gb: 10
  jpeg_quality: 85
  auto_cleanup: true
  retention_days: 7

# ============================================================================
# STORAGE BACKEND (H7 — operator-driven availability policy)
# ============================================================================
# `driver` selects where recordings + snapshots live:
#   local — files on the local filesystem (default; no outbound calls).
#   minio — S3-compatible object store (recordings + snapshots buckets).
#
# `required` controls how the backend reacts when the MinIO driver can't
# reach its endpoint:
#   false (default) — OPTIONAL. Backend boots regardless of MinIO state.
#                     A long-lived background retry loop attempts recovery
#                     with bounded backoff (5s → 15s → 60s → 300s capped).
#                     `/api/health/ready` stays 200 with `storage:
#                     degraded_optional` so the LB keeps routing traffic
#                     and uploads silently no-op until storage recovers.
#                     Right policy for sites where storage is convenience,
#                     not safety-critical (dev, small deploys, kiosk).
#   true            — REQUIRED. init() runs a synchronous bucket check;
#                     on failure main() throws and the process refuses
#                     to start (orchestrator will see a non-zero exit
#                     and back off / page on-call). While running,
#                     `/api/health/ready` returns 503 whenever the
#                     storage_ready flag flips false. Right policy for
#                     prod deployments where lost footage is a compliance
#                     incident.
#
# Env override: VMS_STORAGE_REQUIRED=1 / =true / =yes flips on. Anything
# else (or unset) leaves whatever this YAML says.
#
# Secrets: access_key + secret_key can also come from VMS_MINIO_ACCESS_KEY
# and VMS_MINIO_SECRET_KEY env vars (preferred for prod — keeps the YAML
# safe to commit).
storage:
  driver: "local"
  required: false
  minio:
    endpoint: "http://localhost:9000"
    access_key: "minioadmin"
    secret_key: "minioadmin"
    bucket_recordings: "vms-recordings"
    bucket_snapshots: "vms-snapshots"

# ============================================================================
# LOGGING
# ============================================================================
logging:
  level: "info"
  file_path: "logs/cpp_backend.log"
  console_output: true
  file_output: true
  max_file_size_mb: 100
  max_files: 5
  pattern: "[%Y-%m-%d %H:%M:%S.%e] [%n] [%l] %v"
  
# ============================================================================
# PERFORMANCE
# ============================================================================
performance:
  max_queue_size: 100
  worker_threads: 4
  io_threads: 2
  max_memory_mb: 2048
